# Server
server.port=${PORT:8080}
# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blogvibe_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:blogvibe-super-secret-key-change-this-in-production-2024-secure-and-long-enough-for-hs512-key}
app.jwt.expiration=86400000

spring.config.import=optional:file:../.env[.properties]

# OAuth2 Google (Set actual Client ID and Secret via env vars)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local file storage path fallback
app.upload.dir=./uploads/images

# Cloudflare R2 / Object Storage Configuration (Render Env Vars)
r2.access-key-id=${R2_ACCESS_KEY_ID:${AWS_ACCESS_KEY_ID:}}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:${AWS_SECRET_ACCESS_KEY:}}
r2.endpoint=${R2_ENDPOINT:${AWS_ENDPOINT_URL_S3:}}
r2.account-id=${R2_ACCOUNT_ID:${CLOUDFLARE_ACCOUNT_ID:}}
r2.bucket-name=${R2_BUCKET_NAME:${R2_BUCKET:${AWS_S3_BUCKET:}}}
r2.public-url=${R2_PUBLIC_URL:${R2_CUSTOM_DOMAIN:}}

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.blogvibe=DEBUG

# AI Content Moderation
google.gemini.api.key=${GEMINI_API_KEY:dummy-gemini-key}

