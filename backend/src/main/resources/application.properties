# Server
server.port=${PORT:8080}
# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blogvibe_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:blogvibe-super-secret-key-change-this-in-production-2024-secure-and-long-enough-for-hs512-key}
app.jwt.expiration=86400000

spring.config.import=optional:file:../.env[.properties]

# OAuth2 Google (Set actual Client ID and Secret via env vars)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local file storage path (images uploaded to this directory)
app.upload.dir=./uploads/images

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.blogvibe=DEBUG

# AI Content Moderation
google.gemini.api.key=${GEMINI_API_KEY:dummy-gemini-key}

